<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agenda de Trabajo</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --fondo:#f6f7f9; --tarjeta:#ffffff; --texto:#1f2430; --texto-suave:#6b7280; --borde:#e5e7eb;
  --azul:#2563eb; --azul-suave:#eff4ff; --rojo:#dc2626; --rojo-suave:#fee2e2; --naranja:#d97706; --naranja-suave:#fef3e2;
  --verde:#16a34a; --verde-suave:#dcfce7; --gris:#9ca3af; --sombra:0 10px 30px rgba(15,23,42,.1);
}
@media (prefers-color-scheme: dark){:root{
  --fondo:#11161d; --tarjeta:#1a2029; --texto:#eef1f5; --texto-suave:#9aa4b2; --borde:#2a3240;
  --azul:#5b8def; --azul-suave:#172238; --rojo:#f36b63; --rojo-suave:#3a1b1b; --naranja:#e5a94f; --naranja-suave:#3a2e15;
  --verde:#4ade80; --verde-suave:#163524; --gris:#6b7280; --sombra:0 10px 30px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--fondo);color:var(--texto);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--azul)}
input,select,textarea{font:inherit}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1.05rem;margin:0 0 10px}
.vacio{color:var(--texto-suave);font-size:.9rem;padding:10px 0}

/* ---------- login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:360px;margin:0 auto;padding:24px}
.login h1{font-size:1.6rem}
.login p{color:var(--texto-suave);margin:0}
.login input{border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);border-radius:10px;padding:12px 14px;width:100%;font-size:16px}
.login .campo{display:flex;flex-direction:column;gap:6px}
.login button{background:var(--azul);color:#fff;border:none;border-radius:10px;padding:12px;font-size:1rem;font-weight:600}
.login .error{color:var(--rojo);font-size:.85rem;min-height:1.2em}

/* ---------- shell ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--tarjeta);border-bottom:1px solid var(--borde);padding:10px 16px;gap:10px;position:sticky;top:0;z-index:100}
.menu-nav{position:relative}
.boton-menu{display:flex;align-items:center;gap:8px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto);padding:7px 12px 7px 7px;border-radius:9px;font-size:.88rem;font-weight:600}
.menu-icono-app{width:26px;height:26px;border-radius:7px;flex-shrink:0}
.boton-menu .flecha{font-size:.7rem;color:var(--texto-suave);transition:transform .15s}
.boton-menu.abierto .flecha{transform:rotate(180deg)}
.menu-lista{position:absolute;top:calc(100% + 6px);left:0;min-width:210px;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;box-shadow:var(--sombra);z-index:600;overflow:hidden;display:none}
.menu-lista.visible{display:block}
.menu-lista button{display:block;width:100%;text-align:left;border:none;background:none;color:var(--texto);padding:11px 14px;font-size:.88rem;font-weight:600;border-bottom:1px solid var(--borde)}
.menu-lista button:last-child{border-bottom:none}
.menu-lista button:hover{background:var(--fondo)}
.menu-lista button.activa{color:var(--azul);background:var(--azul-suave)}
.topbar-der{display:flex;align-items:center;gap:8px;flex-shrink:0}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;border:none}
.icono-salir{width:36px;height:36px;border-radius:8px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto-suave);display:flex;align-items:center;justify-content:center}
.icono-salir:hover{color:var(--rojo);border-color:var(--rojo);background:var(--rojo-suave)}

.contenedor{max-width:1000px;margin:0 auto;padding:20px 16px 90px}
.subtitulo{color:var(--texto-suave);margin:0 0 20px}

.resumen{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.chip{background:var(--tarjeta);border:1px solid var(--borde);border-radius:8px;padding:9px 14px;font-size:.85rem;color:var(--texto-suave)}
.chip strong{color:var(--texto);font-size:1.05rem}

.seccion{margin-bottom:18px}
.seccion-titulo{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:8px;font-size:.95rem;width:100%;border:none;background:none;color:inherit;padding:4px 0;text-align:left}
.seccion-titulo .contador{font-weight:400;color:var(--texto-suave);font-size:.8rem}
.seccion-flecha{display:inline-block;font-size:.8rem;color:var(--texto-suave);transition:transform .15s}
.seccion-flecha.cerrada{transform:rotate(-90deg)}
.seccion-lista.oculta{display:none}

.tarjeta-tarea{background:var(--tarjeta);border:1px solid var(--borde);border-left:4px solid var(--gris);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tarjeta-tarea.prioridad-alta{border-left-color:var(--rojo)}
.tarjeta-tarea.prioridad-media{border-left-color:var(--naranja)}
.tarjeta-tarea.prioridad-baja{border-left-color:var(--verde)}
.info-tarea{flex:1;min-width:0}
.titulo-tarea{font-weight:600;margin:0 0 3px}
.meta-tarea{font-size:.82rem;color:var(--texto-suave);margin:0;display:flex;flex-wrap:wrap;gap:4px}
.badge{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--fondo);border:1px solid var(--borde);color:var(--texto-suave)}
.descripcion-tarea{font-size:.85rem;color:var(--texto-suave);margin:6px 0 0}
.acciones-tarea{display:flex;align-items:center;gap:6px;flex-shrink:0}
select.selector-estado{border:none;background:var(--fondo);border-radius:7px;padding:7px 9px;font-size:.8rem;font-weight:600;color:var(--texto)}
select.selector-estado.estado-en_progreso{background:var(--naranja-suave);color:var(--naranja)}
select.selector-estado.estado-completado{background:var(--verde-suave);color:var(--verde)}
.icono-accion{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--borde);background:var(--tarjeta);border-radius:7px;font-size:.95rem}

.boton-primario{background:var(--azul);color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:.9rem;font-weight:600}
.boton-secundario{background:var(--fondo);border:1px solid var(--borde);color:var(--texto);padding:9px 14px;border-radius:8px;font-size:.85rem}
.boton-peligro{background:var(--rojo-suave);border:1px solid var(--rojo);color:var(--rojo);padding:9px 14px;border-radius:8px;font-size:.85rem}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0));width:56px;height:56px;border-radius:50%;background:var(--azul);color:#fff;border:none;font-size:1.6rem;box-shadow:var(--sombra);z-index:90}

.filtros{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filtros select{padding:7px 10px;border-radius:8px;border:1px solid var(--borde);background:var(--tarjeta);color:var(--texto)}

table.tabla{width:100%;border-collapse:collapse;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;overflow:hidden}
table.tabla th,table.tabla td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--borde);font-size:.85rem}
table.tabla th{color:var(--texto-suave);font-weight:600}
table.tabla tr.fila-alerta td.col-vencidas{color:var(--rojo);font-weight:700}
.tabla-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- modal ---------- */
.modal-fondo{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal-fondo.visible{display:flex}
.modal-caja{background:var(--tarjeta);border-radius:14px;padding:20px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--sombra)}
.modal-caja h2{margin-bottom:14px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--fondo);color:var(--texto)}
.campo textarea{resize:vertical;min-height:64px}
.fila-campos{display:flex;gap:10px}
.fila-campos .campo{flex:1}
.modal-botones{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.opcion-checkbox{display:flex;align-items:center;gap:8px;font-weight:400}
.opcion-checkbox input{width:auto}

/* ---------- mensajes flash ---------- */
.mensajes{position:fixed;top:calc(env(safe-area-inset-top,0) + 10px);left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;width:min(92vw,420px)}
.mensaje{padding:10px 14px;border-radius:8px;font-size:.85rem;box-shadow:var(--sombra);transition:opacity .4s,transform .4s}
.mensaje.success{background:var(--verde-suave);color:var(--verde)}
.mensaje.error{background:var(--rojo-suave);color:var(--rojo)}
.mensaje.oculto{opacity:0;transform:translateY(-8px)}


@media (max-width:640px){
  .topbar{padding:8px 12px}
  .acciones-tarea .icono-accion{width:38px;height:38px}
}

/* ---------- calendario ---------- */
.cal-cabecera{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.cal-cabecera h1{text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--borde);background:var(--tarjeta)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-diasem{font-size:.72rem;color:var(--texto-suave);text-align:center;font-weight:600;text-transform:uppercase;padding-bottom:4px}
.cal-celda{min-width:0;background:var(--tarjeta);border:1px solid var(--borde);border-radius:8px;min-height:78px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden}
.cal-celda.fuera-mes{opacity:.35}
.cal-celda.es-hoy{border-color:var(--azul);box-shadow:inset 0 0 0 1px var(--azul)}
.cal-numero{font-size:.78rem;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.cal-contador{background:var(--azul);color:#fff;border-radius:999px;font-size:.65rem;padding:1px 6px;font-weight:700}
.cal-mini{font-size:.68rem;color:var(--texto-suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- equipo / kpis ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.kpi-tarjeta{background:var(--tarjeta);border:1px solid var(--borde);border-radius:12px;padding:14px}
.kpi-tarjeta-cabecera{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kpi-tarjeta-cabecera .avatar{width:30px;height:30px;font-size:.75rem}
.kpi-nombre{font-weight:700;font-size:.9rem}
.kpi-rol{font-size:.72rem;color:var(--texto-suave)}
.kpi-barra{height:7px;border-radius:999px;background:var(--fondo);overflow:hidden;margin-bottom:8px}
.kpi-barra-rellena{height:100%;border-radius:999px}
.kpi-fila{display:flex;justify-content:space-between;font-size:.78rem;color:var(--texto-suave);margin-bottom:3px}
.kpi-fila b{color:var(--texto)}
.kpi-carga-alta .kpi-barra-rellena{background:var(--rojo)}
.kpi-carga-media .kpi-barra-rellena{background:var(--naranja)}
.kpi-carga-baja .kpi-barra-rellena{background:var(--verde)}
.form-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:14px;margin-bottom:18px}
.form-inline .campo{margin-bottom:0;flex:1;min-width:140px}
.lista-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip-quitable{display:inline-flex;align-items:center;gap:6px;background:var(--azul-suave);color:var(--azul);border-radius:999px;padding:4px 6px 4px 10px;font-size:.78rem}
.chip-quitable button{background:none;border:none;color:inherit;font-weight:700;line-height:1;padding:0 2px}
.importar-caja{background:var(--tarjeta);border:1px solid var(--borde);border-radius:10px;padding:14px;margin:22px 0}
.importar-caja textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;padding:9px 10px;border:1px solid var(--borde);border-radius:8px;background:var(--fondo);color:var(--texto);resize:vertical}
.importar-resultado{font-size:.82rem;margin-top:10px;white-space:pre-wrap}
</style>
</head>
<body>

<div id="loginView" class="login" hidden>
  <h1>Agenda de Trabajo</h1>
  <p>Inicia sesión con la cuenta que te asignaron.</p>
  <form id="loginForm">
    <div class="campo">
      <label for="lEmail">Correo</label>
      <input id="lEmail" type="email" autocomplete="username" required>
    </div>
    <div class="campo">
      <label for="lPass">Contraseña</label>
      <input id="lPass" type="password" autocomplete="current-password" required>
    </div>
    <p class="error" id="lErr"></p>
    <button id="lBtn" class="boton-primario" type="submit" style="width:100%">Entrar</button>
  </form>
</div>

<div id="appView" hidden>
  <header class="topbar">
    <div class="menu-nav" id="menuNav">
      <button class="boton-menu" id="btnMenu" type="button" title="Abrir menú">
        <img src="icono-192.png" alt="" class="menu-icono-app">
        <span id="menuActualTexto">Hoy</span>
        <span class="flecha">▾</span>
      </button>
      <div class="menu-lista" id="menuLista"></div>
    </div>
    <div class="topbar-der">
      <div class="avatar" id="avatarUsuario" title="Tu cuenta">?</div>
      <button class="icono-salir" id="btnAvatar" title="Cerrar sesión">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="contenedor" id="vista"></main>

  <button class="fab" id="fabNueva" title="Nueva tarea">+</button>
</div>

<div class="mensajes" id="mensajes"></div>

<!-- Modal: nueva/editar tarea -->
<div class="modal-fondo" id="modalTarea">
  <div class="modal-caja">
    <h2 id="modalTareaTitulo">Nueva tarea</h2>
    <form id="formTarea">
      <input type="hidden" id="tTareaId">
      <div class="campo">
        <label for="tProyecto">Proyecto</label>
        <input id="tProyecto" type="text" autocomplete="off">
      </div>
      <div class="campo">
        <label for="tTitulo">Tarea *</label>
        <input id="tTitulo" type="text" required autocomplete="off">
      </div>
      <div class="campo">
        <label for="tResponsable">Responsable</label>
        <select id="tResponsable" required></select>
      </div>
      <div class="fila-campos">
        <div class="campo">
          <label for="tPrioridad">Prioridad</label>
          <select id="tPrioridad">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </div>
        <div class="campo">
          <label for="tFecha">Fecha límite</label>
          <input id="tFecha" type="date">
        </div>
      </div>
      <div class="campo">
        <label for="tNotas">Notas (opcional)</label>
        <textarea id="tNotas"></textarea>
      </div>
      <div class="campo" id="campoRepetir">
        <label class="opcion-checkbox"><input type="checkbox" id="tRepetir"> Repetir todos los días hasta...</label>
        <input id="tRepetirHasta" type="date" style="margin-top:8px;display:none">
      </div>
      <p class="error" id="tErr"></p>
      <div class="modal-botones">
        <button type="button" class="boton-secundario" id="btnCancelarTarea">Cancelar</button>
        <button type="submit" class="boton-primario" id="btnGuardarTarea">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: eliminar tarea que es parte de una serie repetida -->
<div class="modal-fondo" id="modalEliminarSerie">
  <div class="modal-caja">
    <h2>Esta tarea es parte de una serie</h2>
    <p class="subtitulo" style="margin-bottom:4px">Se repite varios días. ¿Qué quieres eliminar?</p>
    <div class="modal-botones" style="justify-content:flex-start;flex-direction:column;align-items:stretch">
      <button type="button" class="boton-secundario" id="btnSoloEsta" style="width:100%;margin-bottom:8px">Solo esta tarea</button>
      <button type="button" class="boton-peligro" id="btnTodaSerie" style="width:100%;margin-bottom:8px">Toda la serie (pendientes)</button>
      <button type="button" class="boton-secundario" id="btnCancelarSerie" style="width:100%">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal: detalle de un día del calendario -->
<div class="modal-fondo" id="modalDia">
  <div class="modal-caja">
    <h2 id="modalDiaTitulo">Tareas del día</h2>
    <div id="modalDiaLista"></div>
    <div class="modal-botones">
      <button type="button" class="boton-secundario" id="btnCerrarDia">Cerrar</button>
    </div>
  </div>
</div>

  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
<script type="module" src="app.js"></script>
</body>
</html>
